name: ci

on:
  push:
  pull_request:

jobs:
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: template
      - name: build wasm
        run: cargo build --target wasm32-unknown-unknown --release
      - name: shrink wasm
        run: |
          npm install -g binaryen
          RAW=target/wasm32-unknown-unknown/release/tacita.wasm
          mkdir -p out
          wasm-opt -Oz --strip-debug --strip-producers "$RAW" -o out/tacita.wasm
          echo "raw: $(stat -c %s "$RAW") bytes, optimised: $(stat -c %s out/tacita.wasm) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: test
        run: cargo test
      - name: upload wasm
        uses: actions/upload-artifact@v4
        with:
          name: tacita-template-wasm
          path: template/out/tacita.wasm

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: test
        run: cargo test

  cli-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: build tacita.exe
        run: cargo build --release
      - name: upload tacita.exe
        uses: actions/upload-artifact@v4
        with:
          name: tacita-windows
          path: cli/target/release/tacita.exe
