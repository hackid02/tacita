[package]
name = "tacita"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private campaign payouts on Tari Ootle: hidden amounts, enforced totals."

[dependencies]
tari_template_lib = "=0.42.0"

[dev-dependencies]
tari_template_test_tooling = "=0.55.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
