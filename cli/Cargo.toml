[package]
name = "tacita-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Builds and checks tacita private payout statements."

[[bin]]
name = "tacita"
path = "src/main.rs"

[dependencies]
ootle-rs = "=0.37.0"
serde_json = "1"
tari_ootle_transaction = "=0.55.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ureq = { version = "2", features = ["json"] }
