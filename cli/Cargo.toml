[package]
name = "hush-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Builds and checks hush private payout statements."

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
ootle-rs = "=0.37.0"
tari_ootle_transaction = "=0.55.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
